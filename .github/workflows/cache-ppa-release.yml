name: Cache the Git Core PPA build

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cache-ppa-release
  cancel-in-progress: false

jobs:
  cache:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # creates the release and its tag
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Republish the newest build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 -I scripts/cache_ppa_release.py
